name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all
      - run: cargo test --test ffi_test

  build-native:
    name: Build native (${{ matrix.target }})
    needs: test
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            lib: speechmarkdown_rust.dll
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            lib: speechmarkdown_rust.dll
          - target: x86_64-apple-darwin
            os: macos-latest
            lib: libspeechmarkdown_rust.dylib
          - target: aarch64-apple-darwin
            os: macos-latest
            lib: libspeechmarkdown_rust.dylib
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            lib: libspeechmarkdown_rust.so
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            lib: libspeechmarkdown_rust.so
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.lib }}

  publish-crate:
    name: crates.io
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build-wheels:
    name: Python wheel (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: bindings/python
          sccache: "true"
      - name: Build sdist
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: bindings/python
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: bindings/python/dist/*

  publish-pypi:
    name: PyPI
    needs: build-wheels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-npm:
    name: npm
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: bindings/nodejs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm install @napi-rs/cli
      - name: Build all platform binaries
        run: |
          npx napi build --platform --release --target x86_64-pc-windows-msvc
          npx napi build --platform --release --target x86_64-apple-darwin
          npx napi build --platform --release --target aarch64-apple-darwin
          npx napi build --platform --release --target x86_64-unknown-linux-gnu
          npx napi build --platform --release --target aarch64-unknown-linux-gnu
          npx napi build --platform --release --target x86_64-unknown-linux-musl
          npx napi build --platform --release --target aarch64-unknown-linux-musl
      - name: Test
        run: node test.js
      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-nuget:
    name: NuGet
    needs: [test, build-native]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: bindings/dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: native-*
      - name: Organize runtimes
        shell: pwsh
        run: |
          $mapping = @{
            "native-x86_64-pc-windows-msvc" = "win-x64"
            "native-aarch64-pc-windows-msvc" = "win-arm64"
            "native-x86_64-apple-darwin" = "osx-x64"
            "native-aarch64-apple-darwin" = "osx-arm64"
            "native-x86_64-unknown-linux-gnu" = "linux-x64"
            "native-aarch64-unknown-linux-gnu" = "linux-arm64"
          }
          foreach ($entry in $mapping.GetEnumerator()) {
            $src = "../artifacts/$($entry.Key)"
            $dst = "runtimes/$($entry.Value)/native"
            New-Item -ItemType Directory -Force -Path $dst
            Copy-Item "$src/*" $dst
          }
      - name: Pack
        run: dotnet pack SpeechMarkdown.nuspec -o output
      - name: Publish
        run: dotnet nuget push output/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }}
