[package]
name = "speechmarkdown-rust"
version = "0.4.13"
edition = "2021"
authors = ["SpeechMarkdown Contributors"]
description = "High-performance SpeechMarkdown parser with multi-language bindings"
license = "MIT"
readme = "README.md"
repository = "https://github.com/speechmarkdown/speechmarkdown-rust"
keywords = ["speech", "ssml", "tts", "voice", "parser"]
categories = ["parser-implementations", "text-processing"]

[dependencies]
quick-xml = "0.37"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
ipa-translate = { version = "0.2", optional = true }

[features]
default = ["phonetic-translation"]
phonetic-translation = ["dep:ipa-translate"]

[dev-dependencies]
# Removed problematic benchmark dependencies for now

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
